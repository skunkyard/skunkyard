AWSTemplateFormatVersion: "2010-09-09"
Description: Site Launch Kit. Static site on S3 and CloudFront with Route 53 DNS, Purelymail mail records, security headers, and a GitHub Actions deploy role. Deploy in us-east-1 (CloudFront requires its certificate there). Created and updated by infra/provision.py.

Parameters:
  DomainName:
    Type: String
  GitHubRepo:
    Type: String
    Description: The repo part of GitHub's OIDC subject, owner/name or, on immutable subjects, owner@id/name@id. provision.py looks it up.
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Set to true only if the AWS account doesn't have the GitHub OIDC provider yet.
  PurelymailOwnership:
    Type: String
    Description: The Purelymail account's ownership value (provision.py fetches it). Empty skips the mail records.
    Default: ""

  ContentSecurityPolicy:
    Type: String
    Description: The site's Content-Security-Policy header. The default allows only the site's own files.
    Default: "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
  GoogleSiteVerification:
    Type: String
    Description: The google-site-verification=... value from Search Console's Domain property setup. Empty adds no record.
    Default: ""

Conditions:
  MakeOidc: !Equals [!Ref CreateOidcProvider, "true"]
  HasMail: !Not [!Equals [!Ref PurelymailOwnership, ""]]
  HasGsv: !Not [!Equals [!Ref GoogleSiteVerification, ""]]
  GsvWithoutMail: !And [!Condition HasGsv, !Not [!Condition HasMail]]

Resources:
  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName

  # Stack creation waits here until Porkbun's name servers point to HostedZone.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub "www.${DomainName}"]
      ValidationMethod: DNS
      DomainValidationOptions:
        - { DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZone }
        - { DomainName: !Sub "www.${DomainName}", HostedZoneId: !Ref HostedZone }

  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Redirects www to the apex, keeping the path and query, and maps /about/ and /about to /about/index.html.
  WwwRedirect:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-router"
      AutoPublish: true
      FunctionConfig: { Comment: Redirect www to apex and serve index pages, Runtime: cloudfront-js-2.0 }
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value : '';
          if (host === 'www.${DomainName}') {
            var query = Object.keys(request.querystring).map(function (key) {
              var q = request.querystring[key];
              var values = q.multiValue ? q.multiValue.map(function (m) { return m.value; }) : [q.value];
              return values.map(function (v) { return v === '' ? key : key + '=' + v; }).join('&');
            }).join('&');
            var location = 'https://${DomainName}' + request.uri + (query ? '?' + query : '');
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: location } } };
          }
          if (request.uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!request.uri.split('/').pop().includes('.')) {
            request.uri += '/index.html';
          }
          return request;
        }

  # OWASP-recommended headers, the same set skunkyard.com uses.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security"
        SecurityHeadersConfig:
          # Subdomains are left out because the mail records point at Purelymail.
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: false, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          XSSProtection: { Protection: false, Override: true }
          ContentSecurityPolicy: { ContentSecurityPolicy: !Ref ContentSecurityPolicy, Override: true }
        CustomHeadersConfig:
          Items:
            - { Header: Permissions-Policy, Value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()", Override: true }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases: [!Ref DomainName, !Sub "www.${DomainName}"]
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirect.FunctionMetadata.FunctionARN
        # S3 returns 403 for missing keys when the bucket is private. The site must have /404.html.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  # GitHub Actions can only upload the site's files and clear its cache. It can't change the stack:
  # a role that can update a stack can grant itself anything the stack's resources allow.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: !Sub "${Bucket.Arn}/*"
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # Site records. Z2FDTNDATAQYW2 is the fixed hosted zone ID for every CloudFront alias.
  SiteRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZone
      RecordSets:
        - { Name: !Ref DomainName, Type: A, AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: !Ref DomainName, Type: AAAA, AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: !Sub "www.${DomainName}", Type: A, AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: !Sub "www.${DomainName}", Type: AAAA, AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 } }
        - { Name: !Ref DomainName, Type: CAA, TTL: "3600", ResourceRecords: ['0 issue "amazon.com"'] }

  # Mail at Purelymail (https://purelymail.com/docs/domainDocs).
  MailRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasMail
    Properties:
      HostedZoneId: !Ref HostedZone
      RecordSets:
        - { Name: !Ref DomainName, Type: MX, TTL: "3600", ResourceRecords: ["50 mailserver.purelymail.com"] }
        - Name: !Ref DomainName
          Type: TXT
          TTL: "3600"
          # Route 53 keeps every TXT value for a name in one record, so Search Console's value joins here.
          ResourceRecords:
            - '"v=spf1 include:_spf.purelymail.com ~all"'
            - !Sub '"${PurelymailOwnership}"'
            - !If [HasGsv, !Sub '"${GoogleSiteVerification}"', !Ref AWS::NoValue]
        - { Name: !Sub "_dmarc.${DomainName}", Type: CNAME, TTL: "3600", ResourceRecords: [dmarcroot.purelymail.com] }
        - { Name: !Sub "purelymail1._domainkey.${DomainName}", Type: CNAME, TTL: "3600", ResourceRecords: [key1.dkimroot.purelymail.com] }
        - { Name: !Sub "purelymail2._domainkey.${DomainName}", Type: CNAME, TTL: "3600", ResourceRecords: [key2.dkimroot.purelymail.com] }
        - { Name: !Sub "purelymail3._domainkey.${DomainName}", Type: CNAME, TTL: "3600", ResourceRecords: [key3.dkimroot.purelymail.com] }
        - { Name: !Sub "autoconfig.${DomainName}", Type: CNAME, TTL: "3600", ResourceRecords: [autoconfig.purelymail.com] }
        - { Name: !Sub "_autodiscover._tcp.${DomainName}", Type: SRV, TTL: "3600", ResourceRecords: ["0 0 443 autodiscover.purelymail.com"] }

  GsvRecord:
    Type: AWS::Route53::RecordSet
    Condition: GsvWithoutMail
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: TXT
      TTL: "3600"
      ResourceRecords: [!Sub '"${GoogleSiteVerification}"']

Outputs:
  NameServers:
    Description: Set these as the name servers for the domain at Porkbun.
    Value: !Join [", ", !GetAtt HostedZone.NameServers]
  BucketName: { Value: !Ref Bucket }
  DistributionId: { Value: !Ref Distribution }
  DeployRoleArn: { Value: !GetAtt DeployRole.Arn }
