name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skips until the AWS variables from the stack outputs are set in the repository.
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Add your build step here if the site needs one, for example: - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      # Applies changes to infra/site.yaml. The parameters come from site-launch.json, written by provision.py.
      - name: Update infrastructure
        if: hashFiles('site-launch.json') != '' && vars.CFN_ROLE_ARN != ''
        run: |
          mapfile -t params < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' site-launch.json)
          aws cloudformation deploy --stack-name "${{ vars.CFN_STACK }}" --template-file infra/site.yaml \
            --role-arn "${{ vars.CFN_ROLE_ARN }}" --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset \
            --parameter-overrides "${params[@]}"
      - run: aws s3 sync site/ "s3://${{ vars.S3_BUCKET }}" --delete
      - run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
